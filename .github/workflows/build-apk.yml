name: Build CineCut Android APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish CineCut APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build CineCut App APK
        run: |
          cd android
          echo "Generating Gradle Wrapper with installed Gradle 8.10.2..."
          gradle wrapper --gradle-version 8.10.2 || true
          echo "Starting fresh compilation of CineCut Android app from source..."
          gradle :app:clean :app:assembleRelease --no-daemon --stacktrace || gradle :app:assembleDebug --no-daemon --stacktrace
          cd ..

      - name: Organize & Package Release Artifacts
        run: |
          mkdir -p build-output
          # Locate freshly built APK in android/app/build/outputs/apk/
          APP_APK=$(find android/app/build/outputs/apk/ -name "*.apk" ! -name "*unaligned*" ! -path "*/intermediates/*" 2>/dev/null | head -n 1)
          
          if [ -z "$APP_APK" ] || [ ! -f "$APP_APK" ]; then
            echo "Searching android/ build directory for freshly built APK..."
            APP_APK=$(find android/ -name "*.apk" ! -name "*unaligned*" ! -path "*/intermediates/*" 2>/dev/null | head -n 1)
          fi

          if [ -n "$APP_APK" ] && [ -f "$APP_APK" ]; then
            echo "SUCCESS: Freshly built APK created from source code at: $APP_APK"
            cp -v "$APP_APK" build-output/CincutVideoEditorPro-v2.0.0.apk
            cp -v "$APP_APK" build-output/CincutVideoEdittorPro-latest.apk
          else
            echo "CRITICAL BUILD FAILURE: No newly compiled APK was produced by Gradle!"
            exit 1
          fi

          echo "Packaged APK artifacts ready for distribution:"
          ls -lh build-output/

      - name: Upload APKs as GitHub Artifacts (Instant Download)
        uses: actions/upload-artifact@v4
        with:
          name: CincutVideoEditorPro-v2.0.0
          path: build-output/*.apk
          retention-days: 60

      - name: Create GitHub Release with Direct APK Downloads
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v2.0.0-${{ github.run_number }}
          name: "Cincut Video Editor Pro Release v2.0.0 (Build #${{ github.run_number }})"
          body: |
            ### 🎬 Cincut Video Editor Pro v2.0.0 Brand New Package Release

            Brand new standalone package ID (`com.cincut.official.videoeditor`). Installs as a 100% completely new, separate app on your Android device — never reads, conflicts with, or checks against any older builds.

            - 📱 **Direct Download APK**: [**CincutVideoEditorPro-v2.0.0.apk**](https://github.com/robinisking3-byte/CincutVideoEdittorPro/releases/download/v2.0.0-${{ github.run_number }}/CincutVideoEditorPro-v2.0.0.apk)

            #### What's New in v2.0.0:
            - **100% Brand New Android Application ID**: `com.cincut.official.videoeditor` installs cleanly as a separate, fresh app.
            - **14 Professional Color Grading Filters**: Cinematic Gold, Teal & Orange, Noir B&W, Cyberpunk Neon, Warm Sunset, Retro VHS, Emerald Film, Tokyo Night, Pastel Dream, Bleach Bypass, Lomo Chrome, Cold Ice, and Vintage Sepia.
            - **Live ZapUPI Payment Gateway**: Official merchant integration (`zapfe5c7f3c3967c502e85648e908153d54`) with dynamic QR code and 12-digit UTR verification.
            - **Real Video Editing & Media Import**: Device media picker for clips & photos + frame-by-frame canvas export engine with automatic downloads.
            - **Fresh Package ID**: `com.cincut.pro.studio` (Version Code 2, Version Name 1.0.1)
            - **Completely Plain Login/Register Screen**: Removed all "Edit Firebase API Key" dialogs, status cards, and sensitive admin texts. Clean modern design with Google OAuth and Email options.
            - **Zero Old Package Conflict**: Installs cleanly on Android devices as a brand new app.
            - **Authentic Video Export Pipeline**: Real video engine with HTML5 canvas recording directly into the in-app gallery.
            - **Custom User Template Engine**: Create and publish reusable editing presets synced to Firestore.
            - **AI Features**: Marked "Coming Soon" with alert notifications.
          files: build-output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
